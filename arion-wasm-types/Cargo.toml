[package]
name = "arion-wasm-types"
version = "0.1.0"
edition.workspace = true
description = "Shared ABI types between the Arion proxy (host) and the Arion Wasm SDK (guest)."
license = "Apache-2.0"

[dependencies]
http = "1.5"
serde = { version = "1.0.229", features = ["derive"] }
smol_str  = { version = "0.3.6", features = ["serde"] }
http-serde-ext = { version = "1.0.2" }
bytes = { workspace = true, features = ["serde"] }
