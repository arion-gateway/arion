[package]
edition.workspace      = true
license-file.workspace = true
name                   = "orion-configuration"
rust-version.workspace = true
version.workspace      = true


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
base64-serde = "0.7.0"
bounded-integer = { version = "0.6.1", features = ["serde1"] }
bytes.workspace = true
smol_str.workspace = true
exponential-backoff.workspace = true
http.workspace = true
num_cpus.workspace = true
orion-error.workspace = true
orion-format.workspace = true
orion-interner.workspace = true
orion-auth.workspace = true
regex.workspace = true
tracing-rolling-file.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
clap = { version = "4.5.51", features = ["derive"] }
http-serde-ext = "1.0.2"
humantime-serde = "1.1.1"
ipnet = { version = "2.11", features = ["serde"] }
itertools = "0.14.0"
opentelemetry-otlp = { version = "0.29.0", features = [
  "serde",
  "serde_json",
  "serialize",
] }
orion-data-plane-api = { workspace = true, optional = true }
serde = { workspace = true, features = ["rc"] }
serde_path_to_error = "0.1.20"
serde_regex = "1.1.0"
tracing-appender = { version = "0.2.4", features = ["parking_lot"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "std"] }
jsonschema = "0.42.1"


[dev-dependencies]
tracing-test.workspace = true
tempfile = "3.23"

[features]
default           = ["envoy-conversions"]
envoy-conversions = ["dep:orion-data-plane-api"]


[lints]
workspace = true
