[package]
edition.workspace      = true
license-file.workspace = true
name                   = "orion-lib"
rust-version.workspace = true
version.workspace      = true

[dependencies]
dashmap.workspace = true
abort-on-drop.workspace = true
bytes.workspace = true
smol_str.workspace = true
exponential-backoff.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper-util.workspace = true
orion-configuration.workspace = true
orion-data-plane-api.workspace = true
orion-error.workspace = true
orion-format.workspace = true
orion-http-header.workspace = true
orion-interner.workspace = true
orion-tracing.workspace = true
orion-auth.workspace = true
orion-xds.workspace = true
prost.workspace = true
bounded-integer.workspace = true
ppp.workspace = true
regex.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true
atomic_enum.workspace = true
serde_json.workspace = true
tracing-rolling-file.workspace = true
ahash.workspace = true
tonic.workspace = true
arc-swap = "1.7.1"
arrayvec = "0.7.6"
async-stream = "0.3"
atomic-time = "0.1.5"
enum_dispatch = "0.3.13"
futures-util = { version = "0.3", default-features = false }
h2 = "0.4.12"
hickory-resolver = { version = "0.24", features = ["system-config"] }
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27.7", features = ["default", "http2"] }
ipnet = "2.11"
lru_time_cache = "0.11.11"
opentelemetry = "0.29.0"
orion-metrics = { workspace = true, optional = true }
parking_lot = "0.12.5"
pin-project = "1.1.10"
pingora-timeout = "0.3.0"
pretty-duration = "0.1.1"
rand = { version = "0.8.5", features = ["small_rng"] }
rustc-hash = "1.1.0"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2.2"
rustls-platform-verifier = { version = "0.3" }
rustls-webpki = "0.102"
scopeguard = "1.2.0"
thread-id = "5.0.0"
thread_local = "1.1.9"
tokio-rustls = "0.26"
tower-service = "0.3.3"
traceparent = "0.0.3"
tracing-appender = "0.2.3"
twox-hash = "1.6.3"
typed-builder = "0.18.2"
uuid = { version = "1.18.1", features = ["v4"] }
x509-parser = { version = "0.17", features = ["default"] }
ref-cast = "1.0.25"
smallvec = "1.15.1"
assert_matches = "1.5.0"
tokio-util = { version = "0.7.17", features = ["rt"] }
jsonwebtoken = { version = "10.2.0", features = ["aws_lc_rs"] }
chrono = { version = "0.4.42", features = ["serde"] }
base64 = "0.22.1"
schemars = { version = "1.1.0", features = ["std", "derive", "chrono04"] }
pastey = "0.2.1"
owning_ref = "0.4.1"
rmcp = { version = "1.2.0", features = ["client", "transport-streamable-http-client-reqwest"] }
moka = { version = "0.12.12", features = ["sync"] }
contatori = { version = "0.7.5", optional = true }
quanta = { version = "0.12.6", optional = true }
async-trait = { version = "0.1", optional = true }
fastembed = { version = "4", optional = true, default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
hyperlocal = "0.9.1"
jsonschema = "0.41.0"
ctor = "0.6.3"
upon = "0.8"
percent-encoding = "2.3.2"
atomicoption = "0.2.0"
papaya = "0.2.4"
const-str = "1.1.0"
pingora = { version = "0.8.0", features = ["time"] }


[dev-dependencies]
orion-data-plane-api.workspace = true
serde_yaml.workspace           = true
tracing-test.workspace         = true
test-log                       = { version = "0.2.18", features = ["trace"] }

[features]
default   = ["server", "macros", "elicitation", "base64", "schemars"]
metrics   = ["dep:orion-metrics"]
tracing   = []
access-log = []

# performance instrumentation
instrumentation = ["dep:contatori", "dep:quanta"]

# mcp gateway model features:

schemars = []
server = []
macros = []
elicitation = []
base64 = []

# MCP gateway semantic search subsystem. Off by default so deployments that do
# not use semantic search avoid embeddings code and transitive dependencies.
mcp-semantic-search = ["dep:async-trait", "dep:fastembed"]

[lints]
workspace = true
