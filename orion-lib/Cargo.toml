[features]
default   = ["server", "macros", "elicitation", "base64", "schemars"]
metrics   = ["dep:orion-metrics"]
tracing   = []
access-log = []
# HTTP Wasm filter host (wasmtime + orion-wasm-types)
wasm = [
  "dep:orion-wasm-types",
  "dep:wasmtime",
  "dep:bitflags",
  "dep:crossbeam-queue",
  "dep:http-serde-ext",
  "dep:bincode-next",
]

# performance instrumentation
instrumentation = ["dep:contatori"]

# mcp gateway model features:

schemars = []
server = []
macros = []
elicitation = []
base64 = []

