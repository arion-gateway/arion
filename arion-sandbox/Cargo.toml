[package]
name                   = "arion-codemode-sandbox"
edition      = "2024"
license-file = "../LICENSE"
version      = "0.1.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
rquickjs = { version = "=0.12.0", default-features = false, features = ["disable-assertions", "std"] }
wit-bindgen = "=0.57.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "debuginfo"
