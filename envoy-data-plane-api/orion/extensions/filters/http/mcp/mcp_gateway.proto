syntax = "proto3";

package orion.extensions.filters.http.mcp.mcp_gateway.v3;

import "envoy/config/core/v3/base.proto";
import "google/protobuf/duration.proto";
import "validate/validate.proto";

// [#protodoc-title: McpGateway Filter]
// Configuraton for McpGateway
// [#extension: envoy.filters.network.mcp_gateway]
message McpGateway {
    optional string cluster_header = 1;
    ServerInfo server_info = 2 [(validate.rules).message = {required: true}];
    repeated Tool tools = 3;
    SemanticSearch semantic_search_tool = 4;
    // Optional xDS Tool Discovery Service. When set, Tool and DynamicMcpServer
    // resources streamed on the associated config_name augment the statically
    // configured tools/dynamic servers above.
    TdsSpecifier tds = 5;
    // Upstream MCP servers whose tools are discovered at runtime by calling
    // tools/list on the upstream and materialised into this filter's registry.
    repeated DynamicMcpServer dynamic_mcp_servers = 6;
}

// Server info
message ServerInfo {
    // identity for an MCP server (should be unique across all filter chains 
    // in a single Orion instance)
    string name = 1 [(validate.rules).string = {min_bytes: 1}];
    string version = 2 [(validate.rules).string = {min_bytes: 1}];
}

// Tool configuration
message Tool {
    string name = 1 [(validate.rules).string = {min_bytes: 1}];
    string description = 2 [(validate.rules).string = {min_bytes: 1}];
    envoy.config.core.v3.DataSource input_schema = 3;
    envoy.config.core.v3.DataSource output_schema = 4;
    oneof upstream_backend {
        RestBackend rest_backend = 5;
        FunctionGraphBackend function_graph_backend = 6;
        McpServerBackend mcp_server_backend = 7;
    };
    optional ToolRbac rbac = 8;
    repeated float embedding = 9 [packed = true];
}

message RestBackend {
  string method = 1 [(validate.rules).string = {min_bytes: 1}];
  string path = 2 [(validate.rules).string = {min_bytes: 1}];
  repeated QueryParam query_params = 3;
  string cluster = 4 [(validate.rules).string = {min_bytes: 1}];
  bool async = 5;
  envoy.config.core.v3.DataSource body_template = 6;
}

message QueryParam {
  string name = 1 [(validate.rules).string = {min_bytes: 1}];
  string source = 2 [(validate.rules).string = {min_bytes: 1}];
}

message FunctionGraphBackend {
}

message McpServerBackend {
// Use a oneof to represent the transport type
  enum TransportUpstream {
    Sse = 0;
    StreamableHttp = 1;
  }
  TransportUpstream transport = 1;
  string url = 2 [(validate.rules).string = {min_bytes: 1}];
  // Fields 3 (cache_duration) and 4 (dynamic_backend) were removed: dynamic
  // tool discovery now lives on DynamicMcpServer.
  reserved 3, 4;
  reserved "cache_duration", "dynamic_backend";
}

// Source of dynamically discovered tools. The gateway calls tools/list on the
// upstream at bootstrap (and again after cache_duration expires) and exposes
// each returned tool as {name}__{upstream_tool_name} in the registry.
message DynamicMcpServer {
  string name = 1 [(validate.rules).string = {min_bytes: 1}];
  string description = 2;
  McpServerBackend.TransportUpstream transport = 3;
  string url = 4 [(validate.rules).string = {min_bytes: 1}];
  // If unset, the first fetch is cached indefinitely.
  google.protobuf.Duration cache_duration = 5;
  // Applied to every tool materialised from this server.
  optional ToolRbac rbac = 6;
}

// Tool Discovery Service binding. config_name selects which TDS stream's
// Tool / DynamicMcpServer resources this filter consumes (resource IDs are
// of the form "{config_name}/{resource_name}").
message TdsSpecifier {
  string config_name = 1 [(validate.rules).string = {min_bytes: 1}];
}

// RBAC configuration for individual MCP tools
// Specifies JWT-based access control rules for tool access
message ToolRbac {
  // Action to take when permissions are evaluated
  enum Action {
    // Allow access if any permission matches (default deny)
    ALLOW = 0;
    // Deny access if any permission matches (default allow)
    DENY = 1;
  }

  // The action to take (ALLOW or DENY)
  Action action = 1;

  // List of permissions (OR logic - any permission can match)
  // At least one permission must be specified
  repeated Permission permissions = 2 [(validate.rules).repeated = {min_items: 1}];
}

// Permission - defines JWT requirements for tool access
message Permission {
  oneof permission_type {
    option (validate.required) = true;

    // Match based on JWT header field
    JwtHeaderMatcher jwt_header = 1;

    // Match based on JWT claim field
    JwtClaimMatcher jwt_claim = 2;
  }
}

// JWT header field matcher
message JwtHeaderMatcher {
  string field = 1 [(validate.rules).string = {min_bytes: 1}];
  string value = 2 [(validate.rules).string = {min_bytes: 1}];
}

// JWT claim field matcher
message JwtClaimMatcher {
  string field = 1 [(validate.rules).string = {min_bytes: 1}];
  string value = 2 [(validate.rules).string = {min_bytes: 1}];
}

// Enables searching for relevant tools within an Orion hosted MCP gateway
message SemanticSearch {
    bool enable_assisted_discovery = 1;
    // customize shape of results for relevant tools
    SimilarityConfig similarity = 2;
    // Optional OpenAI-compatible remote embeddings endpoint. When omitted,
    // Orion ranks tools with the built-in BM25 scorer.
    RemoteEmbeddings embeddings = 3;
}

message RemoteEmbeddings {
    // Orion cluster used to reach the embeddings endpoint.
    string cluster = 1 [(validate.rules).string = {min_bytes: 1}];
    // Model id sent in the OpenAI-compatible embeddings request body.
    string model_id = 2 [(validate.rules).string = {min_bytes: 1}];
    // Request path on the remote endpoint. Empty means /v1/embeddings.
    string path = 3;
    google.protobuf.Duration timeout = 4;
    // Optional explicit vector dimension. When omitted, Orion learns it from
    // the first successful embeddings response and validates later responses
    // against that observed dimension.
    optional uint32 dimensions = 5;
    // Allow falling back to the built-in BM25 scorer when the remote embeddings
    // service is unavailable or a tool has no embedding yet. Defaults to true.
    // When false, Orion skips building BM25 term statistics entirely and
    // semantic_search calls fail if cosine ranking is unavailable.
    optional bool allow_bm25_fallback = 6;
}

message SimilarityConfig {
    // Maximum number of results to return. 0 means unlimited.
    uint32 top_k = 1;
}
