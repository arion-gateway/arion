syntax = "proto3";

package arion.extensions.filters.http.mcp.mcp_gateway.v3;

import "envoy/config/core/v3/base.proto";
import "envoy/config/route/v3/route_components.proto";
import "google/protobuf/duration.proto";

// [#protodoc-title: McpGateway Filter]
// Configuraton for McpGateway
// [#extension: envoy.filters.network.mcp_gateway]
message McpGateway {
    ServerInfo server_info = 1;
    repeated Tool tools = 2;
    // Search and ranking configuration. When omitted, Arion uses BM25 with
    // the default result limit.
    ToolSearch search = 3;
    // Optional xDS Tool Discovery Service. When set, Tool, DynamicMcpServer,
    // OpenApiToolSource, and CodeMode-only Toolkit resources matching this
    // configuration are consumed over xDS.
    TdsSpecifier tds = 4;
    // Upstream MCP servers whose tools are discovered at runtime by calling
    // tools/list on the upstream and materialised into this filter's registry.
    repeated DynamicMcpServer dynamic_mcp_servers = 5;
    // Request timeout applied for upstream requests (when not set explicitly). Defaults to 15s.
    google.protobuf.Duration upstream_timeout = 6;
    // Maximum REST response body or serialized MCP tool result. Defaults to 1 MiB.
    optional uint64 max_upstream_response_bytes = 7;
    oneof mode {
        // Normal MCP tool discovery and invocation.
        ToolsMode tools_mode = 8;
        // Sandboxed TypeScript execution as the exclusive MCP tool surface.
        CodeMode code_mode = 9;
    }
    // OpenAPI documents whose operations are expanded into REST-backed tools
    // at configuration time.
    repeated OpenApiToolSource open_api_tool_sources = 10;
}

// Server info
message ServerInfo {
    // identity for an MCP server (should be unique across all filter chains
    // in a single Arion instance)
    string name = 1;
    string version = 2;
}

message ToolsMode {}

// Sandboxed TypeScript execution exposed as the exclusive `execute` tool.
message CodeMode {
    // Maximum wall-clock duration of one execution. Defaults to 30s.
    google.protobuf.Duration execution_timeout = 1;
    // Maximum host calls made by one execution, including catalog operations,
    // tool calls, and logging. Defaults to 100.
    uint32 max_host_calls = 2;
    // Maximum simultaneous executions for this listener. Defaults to 32.
    uint32 max_concurrent_executions = 3;
    // Maximum simultaneous in-flight tool and catalog dispatches within one
    // execution. Defaults to 8.
    uint32 max_concurrent_tool_calls = 8;
    // Maximum serialized result size. Defaults to 1 MiB and must be at least 1 KiB.
    uint64 max_output_bytes = 4;
    // Maximum sandbox linear-memory size. Defaults to 64 MiB.
    uint64 memory_limit_bytes = 5;
    // Optional override for the vendored sandbox component.
    optional string engine_artifact_path = 6;
    // CodeMode-only curated tool references available through the catalog SDK.
    repeated Toolkit toolkits = 7;
}

// Tool configuration
message Tool {
    // Public logical namespace for a set of tools.
    string namespace = 1;
    // Local name within the namespace.
    string name = 2;
    string description = 3;
    envoy.config.core.v3.DataSource input_schema = 4;
    envoy.config.core.v3.DataSource output_schema = 5;
    oneof upstream_backend {
        RestBackend rest_backend = 6;
        FunctionGraphBackend function_graph_backend = 7;
        McpServerBackend mcp_server_backend = 8;
    };
    optional ToolRbac rbac = 9;
    repeated float embedding = 10 [packed = true];
    DisclosureMode disclosure_mode = 11;
}

// Controls whether a tool is listed directly in tools/list or only available by search.
enum DisclosureMode {
    PROGRESSIVE = 0;
    EAGER = 1;
}

message RestBackend {
  string method = 1;
  string path = 2;
  repeated QueryParam query_params = 3;
  string cluster = 4;
  oneof body {
    envoy.config.core.v3.DataSource body_template = 5;
    string body_json = 7;
  }
  HttpUpstreamPolicy upstream_policy = 6;
}

message HttpUpstreamPolicy {
  // Sets the HTTP Host/:authority when routing upstream (required for ORIGINAL_DST clusters).
  optional string authority = 1;
  // Overrides the gateway-wide timeout when making upstream request.
  google.protobuf.Duration timeout = 2;
  envoy.config.route.v3.RetryPolicy retry_policy = 3;
}

message QueryParam {
  string name = 1;
  string source = 2;
}

message FunctionGraphBackend {
}

message McpServerBackend {
// Use a oneof to represent the transport type
  enum TransportUpstream {
    Sse = 0;
    StreamableHttp = 1;
  }
  TransportUpstream transport = 1;
  string url = 2;
  // Cluster used to reach the MCP server. The cluster endpoints, TLS context
  // and HTTP protocol options (HTTP/1 or HTTP/2) are taken from its
  // configuration; `url` only provides the request path (and query).
  string cluster = 3;
}

// Source of dynamically discovered tools. The namespace is both the public
// namespace assigned to materialized tools and this resource's live identity.
message DynamicMcpServer {
  string namespace = 1;
  string description = 2;
  McpServerBackend.TransportUpstream transport = 3;
  string url = 4;
  // Minimum interval between refresh attempts. If unset, a successful first
  // fetch is cached indefinitely and failed attempts use a 30-second backoff.
  google.protobuf.Duration cache_duration = 5;
  // Applied to every tool materialised from this server.
  optional ToolRbac rbac = 6;
  // Applied to every tool materialised from this server.
  DisclosureMode tool_disclosure_mode = 7;
  // Cluster used to reach the MCP server, see McpServerBackend.cluster.
  string cluster = 8;
}

// An OpenAPI 3.x document expanded into one REST-backed tool per operation.
// The namespace is both the public namespace of the derived tools and this
// resource's live identity. The policy and settings are applied to every
// derived Tool definition.
message OpenApiToolSource {
  // OpenAPI 3.x document, JSON or YAML.
  envoy.config.core.v3.DataSource spec = 1;
  string namespace = 2;
  string cluster = 3;
  HttpUpstreamPolicy upstream_policy = 4;
  optional ToolRbac rbac = 5;
  DisclosureMode tool_disclosure_mode = 6;
  // Overrides the base path taken from the spec's first server URL.
  optional string path_prefix = 7;
  // When false (the default), operations that cannot be expressed as REST
  // tools fail the configuration; when true they are skipped with a warning.
  bool skip_unsupported_operations = 8;
  // Glob patterns ('*' and '?') matched against an operation's operationId
  // and its "METHOD /path" form. An empty include list selects all
  // operations; exclusions are applied after inclusions.
  repeated string include_operations = 9;
  repeated string exclude_operations = 10;
}

// Tool Discovery Service binding. config_name selects which TDS stream's
// Tool, DynamicMcpServer, OpenApiToolSource, and CodeMode-only Toolkit
// resources this filter consumes (resource IDs are of the form
// "{server_info.name}/{config_name}/{resource_name}").
message TdsSpecifier {
  string config_name = 1;
}

// RBAC configuration for individual MCP tools
// Specifies JWT-based access control rules for tool access
message ToolRbac {
  // Action to take when permissions are evaluated
  enum Action {
    // Allow access if any permission matches (default deny)
    ALLOW = 0;
    // Deny access if any permission matches (default allow)
    DENY = 1;
  }

  // The action to take (ALLOW or DENY)
  Action action = 1;

  // List of permissions (OR logic - any permission can match)
  // At least one permission must be specified
  repeated Permission permissions = 2;
}

// Permission - defines JWT requirements for tool access
message Permission {
  oneof permission_type {
    // Match based on JWT header field
    JwtHeaderMatcher jwt_header = 1;

    // Match based on JWT claim field
    JwtClaimMatcher jwt_claim = 2;
  }
}

// JWT header field matcher
message JwtHeaderMatcher {
  string field = 1;
  string value = 2;
}

// JWT claim field matcher
message JwtClaimMatcher {
  string field = 1;
  string value = 2;
}

// Tunes search ranking and result limits for an Arion-hosted MCP gateway.
message ToolSearch {
    // Maximum number of results a caller may request. Defaults to 5.
    optional uint32 max_allowable_results = 1;
    // Optional OpenAI-compatible remote embeddings endpoint. When omitted,
    // Arion ranks tools with the built-in BM25 scorer.
    RemoteEmbeddings embeddings = 2;
}

message RemoteEmbeddings {
    // Arion cluster used to reach the embeddings endpoint.
    string cluster = 1;
    // Model id sent in the OpenAI-compatible embeddings request body.
    string model_id = 2;
    // Request path on the remote endpoint. Empty means /v1/embeddings.
    string path = 3;
    google.protobuf.Duration timeout = 4;
    // Vector dimension produced by the model. Must be greater than zero.
    uint32 dimensions = 5;
    // Maximum inputs sent per embeddings request. Defaults to 64.
    optional uint32 max_batch_size = 6;
}

// A globally named, CodeMode-only curated Tool list reference.
// This simplifies the discovery of a (sub)set of tools related to a task.
message Toolkit {
    string name = 1;
    string description = 2;
    string instructions = 3;
    repeated ToolkitToolRef tools = 4;
}

message ToolkitToolRef {
    string namespace = 1;
    string name = 2;
}
