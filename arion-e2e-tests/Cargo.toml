[package]
edition.workspace      = true
license-file.workspace = true
name                   = "arion-e2e-tests"
rust-version.workspace = true
version.workspace      = true
description            = "E2E test harness for Arion Proxy"

[dependencies]
tokio.workspace       = true
futures.workspace     = true
tokio-stream.workspace = true
hyper-util.workspace  = true
http.workspace        = true
http-body.workspace   = true
http-body-util.workspace = true
serde.workspace       = true
serde_json.workspace  = true
serde_yaml.workspace  = true
thiserror.workspace   = true
tracing.workspace     = true
bytes.workspace       = true
base64.workspace      = true
arion-data-plane-api.workspace = true
arion-xds.workspace = true
arion-configuration.workspace = true
smol_str.workspace = true
smallvec.workspace = true
prost.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-prost.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
uuid = { workspace = true, features = ["v4"] }
pingora-timeout.workspace = true
dashmap.workspace = true
atomic-take.workspace = true
jsonwebtoken.workspace = true
tokio-rustls.workspace = true
ppp = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
rustls-pemfile.workspace = true
ctor.workspace = true
clap.workspace = true
test-log = { workspace = true, features = ["trace"] }
futures-util.workspace = true
pingora = { workspace = true, features = ["time"] }
fastembed = { version = "4", optional = true, default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }

[dev-dependencies]
tracing-test.workspace = true

[features]
default = []
fastembed-service = ["dep:fastembed"]
mcp-tests = []

[[example]]
name = "fastembed_embedding_service"
path = "examples/fastembed_embedding_service.rs"
required-features = ["fastembed-service"]

[[test]]
name = "mcp_gateway_semantic_search"
path = "tests/mcp_gateway_semantic_search.rs"

[build-dependencies]
tonic-prost-build.workspace = true

[lints]
workspace = true
