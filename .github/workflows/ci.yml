name: CI — fmt, clippy, build, test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # Replaces the rustflags in .cargo/config.toml, minus target-cpu=native: the cached
  # target/ is restored on runners with different CPUs, causing SIGILL. Also switches
  # to the lld linker (installed below), which is much faster at linking the large
  # number of e2e test binaries than the default bfd linker.
  RUSTFLAGS: -C force-frame-pointers=no -C link-arg=-fuse-ld=lld

jobs:
  # Fast checks that run in parallel (no build artifacts needed)
  checks:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Install protoc and lld
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          profile: minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Make sure a RUSTFLAGS change busts the cache, regardless of the defaults
          env-vars: RUSTFLAGS
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (fail on warnings)
        run: cargo clippy --all-targets --all-features

  # Build and test that share artifacts
  build-and-test:
    name: build + unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Install protoc and lld
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown # for the Wasm test filters
          profile: minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Make sure a RUSTFLAGS change busts the cache, regardless of the defaults
          env-vars: RUSTFLAGS
          cache-on-failure: true

      - name: Build (release)
        run: cargo build --all-features --workspace --release --locked

      - name: Run tests
        run: cargo test --all-features --workspace --release --locked

  # E2E tests spawn the arion binary, so build it (release, all features) first
  e2e-test:
    name: build + e2e-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Install protoc and lld
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown # for the Wasm test filters
          profile: minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # arion-wasm-sdk is its own workspace (kept out of the main one), so it needs
          # its own entry here too
          workspaces: |
            . -> target
            arion-wasm-sdk -> target
          # Make sure a RUSTFLAGS change busts the cache, regardless of the defaults
          env-vars: RUSTFLAGS
          cache-on-failure: true

      - name: Build arion (release, all features)
        run: cargo build -p arion-proxy --all-features --release --locked

      # arion-e2e-tests/build.rs builds these too, but only warns if that fails. It also
      # strips RUSTFLAGS, so unset it here to match and avoid compiling the filters twice.
      # Kept as debug: filters_wasm.rs loads them from wasm32-unknown-unknown/debug/
      - name: Build Wasm test filters
        working-directory: arion-wasm-sdk
        run: env -u RUSTFLAGS cargo build --target wasm32-unknown-unknown --workspace

      - name: Run e2e tests
        env:
          # The harness prefers target/debug/arion when present, so pin the release build
          ARION_BIN: ${{ github.workspace }}/target/release/arion
        run: cargo test -p arion-e2e-tests --release --no-fail-fast -- --test-threads 1 --ignored --no-capture
