[package]
edition.workspace      = true
license-file.workspace = true
name                   = "arion-configuration"
rust-version.workspace = true
version.workspace      = true


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64.workspace = true
base64-serde.workspace = true
bounded-integer = { workspace = true, features = ["serde1"] }
bytes.workspace = true
smol_str.workspace = true
exponential-backoff.workspace = true
http.workspace = true
num_cpus.workspace = true
arion-error.workspace = true
arion-format.workspace = true
arion-interner.workspace = true
regex.workspace = true
tracing-rolling-file.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
ahash.workspace = true
clap = { workspace = true, features = ["derive"] }
http-serde-ext.workspace = true
humantime-serde.workspace = true
ipnet = { workspace = true, features = ["serde"] }
itertools.workspace = true
opentelemetry-otlp = { workspace = true, features = [
  "serde",
  "serde_json",
  "serialize",
] }
arion-data-plane-api = { workspace = true, optional = true }
serde = { workspace = true, features = ["rc"] }
smallvec = { workspace = true, features = ["serde"] }
serde_path_to_error.workspace = true
serde_regex.workspace = true
tracing-appender = { workspace = true, features = ["parking_lot"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "std"] }
jsonschema.workspace = true
time.workspace = true
triomphe.workspace = true

[dev-dependencies]
tracing-test.workspace = true
tempfile.workspace = true

[features]
default           = ["envoy-conversions"]
envoy-conversions = ["dep:arion-data-plane-api"]


[lints]
workspace = true
