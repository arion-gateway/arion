runtime:
  num_cpus: 1
  num_runtimes: 1
  event_interval: 31          # estimated optimal value
  global_queue_interval: null   # default
  max_io_events_per_tick: null  # default
access_logging:
  num_instances: 1
  queue_length: 64
  max_log_files: 5
  log_rotation: minutely
  log_max_size: 1000
  blocking: true
logging:
  log_level: "info"
envoy_bootstrap:
  static_resources:
    listeners:
      - name: listener_http
        address:
          socket_address: { address: 0.0.0.0, port_value: 8000 }
        filterChains:
          - name: filter_chain_http
            filter_chain_match:
              destination_port: 8000
            filters:
              - name: http_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_http
                  codecType: HTTP1
                  http_filters:
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  access_log:
                    - name: envoy.access_loggers.file
                      typed_config:
                        #"@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                        "@type": type.googleapis.com/envoy.extensions.access_loggers.file.v3.FileAccessLog
                        path: "/home/debian/orion/access-log.txt"
                        log_format:
                          text_format: "[%START_TIME%] bytes_received:%BYTES_RECEIVED% bytes_sent:%BYTES_SENT% %REQ(:METHOD)% %REQ(X-Custom-Header)% status=%RESPONSE_CODE% duration=%DURATION% downstream:%DOWNSTREAM_REMOTE_ADDRESS%\n"
                  route_config:
                    name: basic_http_route
                    request_headers_to_add:
                      - header:
                          key: "x-user-agent"
                          value: "%REQ(USER-AGENT)%"
                      - header:
                          key: "downstream-remote"
                          value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                    virtual_hosts:
                      - name: backend
                        domains: ["*"]
                        routes:
                          - match:
                              prefix: "/"
                            route:
                              cluster: "http-cluster"
    clusters:
      - name: http-cluster
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 127.0.0.1
                        port_value: 9000
