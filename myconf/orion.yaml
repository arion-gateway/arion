runtime:
  num_cpus: 4
  num_runtimes: 4
  event_interval: 31          # estimated optimal value
  global_queue_interval: null   # default
  max_io_events_per_tick: null  # default
logging:
  log_level: "info"
envoy_bootstrap:
  static_resources:
    listeners:
      - name: listener_http
        address:
          socket_address: { address: 0.0.0.0, port_value: 8000 }
        filterChains:
          - name: filter_chain_http
            filter_chain_match:
              destination_port: 8000
            filters:
              - name: http_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_http
                  codecType: HTTP1
                  http_filters:
                    #- name: envoy.filters.http.ext_proc
                    #  typed_config:
                    #    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                    #    # Configuration for the external processing gRPC service
                    #    grpc_service:
                    #      envoy_grpc:
                    #        cluster_name: ext_proc_cluster
                    #      timeout: 0.5s # Timeout for the gRPC call
                    #    # Defines what processing phases to engage
                    #    observability_mode: false
                    #    processing_mode:
                    #      request_header_mode: SEND
                    #      request_body_mode: BUFFERED
                    #      request_trailer_mode: SKIP
                    #      response_header_mode: SKIP
                    #      response_body_mode: NONE
                    #      response_trailer_mode: SKIP
                    #- name: orion.filters.http.mcp
                    #  typed_config:
                    #    "@type": type.googleapis.com/orion.extensions.filters.http.mcp.mcp_gateway.v3.McpGateway
                    #    cluster_header: "x-mcp-target-cluster"
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  route_config:
                    name: basic_http_route
                    virtual_hosts:
                      - name: backend
                        domains: ["*"]
                        request_headers_to_add:
                          - header: { key: "x-custom-header", value: "request:42" }
                        request_headers_to_remove: ["x-internal-id"]
                        response_headers_to_add:
                          - header: { key: "x-custom-header", value: "response:42" }
                        response_headers_to_remove: ["x-response-header"]
                        routes:
                          - match:
                              prefix: "/direct"
                            direct_response:
                              status: 200
                              body:
                                inline_string: "meow!"
                          - match:
                              prefix: "/"
                            name: "upstream"
                            route:
                              cluster: cluster_http
                              #cluster_header: "x-mcp-target-cluster"
    clusters:
      - name: cluster_http
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 127.0.0.1
                        port_value: 9000 
      - name: ext_proc_cluster
        type: STATIC
        connect_timeout: 1.25s
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        # This cluster points to your ext_proc gRPC server
        load_assignment:
          cluster_name: ext_proc_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 0.0.0.0
                    port_value: 18080 # ext_proc service port
