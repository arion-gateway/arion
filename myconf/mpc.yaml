runtime:
    num_cpus: 4
    num_runtimes: 4
    event_interval: 31 # estimated optimal value
    global_queue_interval: null # default
    max_io_events_per_tick: null # default
logging:
    log_level: "info"
envoy_bootstrap:
    static_resources:
        listeners:
            - name: listener_http
              address:
                  socket_address: { address: 0.0.0.0, port_value: 3000 }
              filterChains:
                  - name: filter_chain_http
                    filter_chain_match:
                        destination_port: 3000
                    filters:
                        - name: http_gateway
                          typedConfig:
                              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                              statPrefix: ingress_http
                              codecType: HTTP1
                              http_filters:
                                  - name: envoy.filters.http.cors
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                                  #- name: envoy.filters.http.jwt_authn
                                  #  typed_config:
                                  #      "@type": "type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication"
                                  #      providers:
                                  #          oauth_provider:
                                  #            from_headers:
                                  #              - name: Authorization
                                  #                value_prefix: "Bearer "
                                  #            issuer: "https://auth.example.com"
                                  #            audiences: ["mcp-gateway"]
                                  #            claim_to_headers:
                                  #              - header_name: "x-user-id"    # Nome dell'header che ricevera il backend
                                  #                claim_name: "name"
                                  #            local_jwks:
                                  #                inline_string: >-
                                  #                    {"keys": [
                                  #                        {
                                  #                            "kty": "RSA",
                                  #                            "e": "AQAB",
                                  #                            "use": "sig",
                                  #                            "kid": "sig-2025-12-12T15:52:22Z",
                                  #                            "alg": "RS256",
                                  #                            "n": "hi3pcXuRrhy2gHjkHCq6JBcxpeC5udojlLukmsyAZ7x1vHwHTx_9c6s73XhfJoRBnd3V3SL1JAUuBiVJ68Pnrtuztp5j8Cdw33S5jKf-8PranMucG_4wWejWm1gbKomZBm79Baf_fJkDOwumsTXvO9dgX7c2dHtA0oO15eVdzSDf7azgLU7OvVukiE71tqoQwnPgK47xDvjw83ZN8eWZzDPGpA9DVoEjhwOeasDgUdVv1L-b2uOqCMYcLixYJ58O48cQSEOreIi1FbIJGoT19VKtJ528JrTkKihZb-BmFIvyIu36lGRpeJ1pbarIMx-sC_-UfKEawHmYQp7MwB1dnQ"
                                  #                        }
                                  #                    ]}
                                  #      rules:
                                  #          - match:
                                  #                prefix: "/"
                                  #            requires:
                                  #                provider_name: oauth_provider
                                  - name: orion.filters.http.mcp
                                    typed_config:
                                      "@type": type.googleapis.com/orion.extensions.filters.http.mcp.mcp_gateway.v3.McpGateway
                                      server_info:
                                        name: "orion-mcp-gateway"
                                        version: "0.1.0"
                                      cluster_header: "x-mcp-target-cluster"
                                      dynamic_tool_discovery: true
                                      tools:
                                        - name: "choose a name for a pet"
                                          description: "Choose a name for a pet"
                                          input_schema:
                                            inline_string: >-
                                              {
                                                "type": "object",
                                                "required": []
                                              }
                                          rest_backend:
                                            cluster: choose_a_name
                                            method: GET
                                            path: "/v1/forecast"
                                        - name: "weather_get_forecast"
                                          description: "Get weather forecast for home"
                                          input_schema:
                                            inline_string: >-
                                              {
                                                "type": "object",
                                                "properties": {
                                                  "latitude": {
                                                    "type": "number"
                                                  },
                                                  "longitude": {
                                                    "type": "number"
                                                  },
                                                  "days": {
                                                    "type": "integer",
                                                    "default": 7
                                                  }
                                                },
                                                "required": ["latitude", "longitude"]
                                              }
                                          rest_backend:
                                            cluster: weather_api_cluster
                                            method: GET
                                            path: "/v1/forecast"
                                        - name: "post_order"
                                          description: "Post an order"
                                          input_schema:
                                            inline_string: >-
                                              {
                                                "type": "object",
                                                "properties": {
                                                  "product_id": {
                                                    "type": "number"
                                                  },
                                                  "quantity": {
                                                    "type": "integer",
                                                    "default": 1
                                                  },
                                                  "customer_id": {
                                                    "type": "number"
                                                  }
                                                },
                                                "required": ["product_id", "customer_id"]
                                              }
                                          rest_backend:
                                            cluster: order_api_cluster
                                            method: POST
                                            path: "/api/product"
                                        #- name: "everything"
                                        #  description: "everything mcp server"
                                        #  input_schema:
                                        #    inline_string: >- 
                                        #      {}
                                        #  mcp_server_backend:
                                        #    transport: StreamableHttp
                                        #    url: http://127.0.0.1:3001/mcp
                                        #    cache_duration: 10s
                                  - name: envoy.filters.http.router
                                    typedConfig:
                                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                                        start_child_span: false
                              route_config:
                                  name: basic_http_route
                                  virtual_hosts:
                                      - name: backend
                                        domains: ["*"]
                                        routes:
                                            - match:
                                                  prefix: "/"
                                              route:
                                                  cluster_header: "x-mcp-target-cluster"
        clusters:
            - name: weather_api_cluster
              connect_timeout: 0.25s
              type: STATIC
              lb_policy: ROUND_ROBIN
              load_assignment:
                  endpoints:
                      - lb_endpoints:
                            - endpoint:
                                  address:
                                      socket_address:
                                          address: 127.0.0.1
                                          port_value: 8000
            - name: order_api_cluster
              connect_timeout: 0.25s
              type: STATIC
              lb_policy: ROUND_ROBIN
              load_assignment:
                  endpoints:
                      - lb_endpoints:
                            - endpoint:
                                  address:
                                      socket_address:
                                          address: 127.0.0.1
                                          port_value: 8001
            - name: choose_a_name
              connect_timeout: 0.25s
              type: STATIC
              lb_policy: ROUND_ROBIN
              load_assignment:
                  endpoints:
                      - lb_endpoints:
                            - endpoint:
                                  address:
                                      socket_address:
                                          address: 127.0.0.1
                                          port_value: 8003
