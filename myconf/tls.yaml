runtime:
  num_cpus: 1
  num_runtimes: 1
  num_service_threads: 2
  event_interval: 31          # estimated optimal value
  global_queue_interval: null   # default
  max_io_events_per_tick: null  # default
access_logging:
  num_instances: 1
  queue_length: 64
  max_log_files: 5
  blocking: true
  log_rotation: daily
logging:
  log_level: "info"
metrics:
  user_key:
     source: Sni
  #  attribute_name: "user"
  #user_key:
  #  source: !HeaderName x-user-id
  #  attribute_name: "user"
  user_metrics:
    invocations: "xxx_invocations"
  custom_key:
    source: !HeaderName x-user-id
    attribute_name: "metric-partition"
  custom_metrics:
    #incoming_request:
    upstream_request:
      - !Counter
        name: "custom_request_counter"
        description: "Counts requests based on a custom header"
        header_name: "x-custom-counter"
        attribute_name: "counter_value"
      - !Gauge
        name: "custom_request_value"
        description: "Value of a custom header"
        header_name: "x-custom-value"
        attribute_name: "value"
      - !Histogram
        name: "custom_request_size"
        description: "Records request sizes from a custom header"
        header_name: "x-custom-size"
        buckets: [10, 50, 100, 500, 1000, +inf]
envoy_bootstrap:
  admin:
    address:
      socketAddress:
        address: "0.0.0.0"
        portValue: 9901
  stats_flush_interval: 5s
  stats_sinks:
    - name: envoy.stat_sinks.metrics_service
      typed_config:
          "@type": type.googleapis.com/envoy.extensions.stat_sinks.open_telemetry.v3.SinkConfig
          grpc_service:
              google_grpc:
                  target_uri: "http://192.168.86.27:4317" # open-telemetry collector address
