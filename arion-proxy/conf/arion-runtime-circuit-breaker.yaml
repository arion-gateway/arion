#  http request ---> 0.0.0.0:8000 ---/strict/*---> (cluster_strict) 10.0.0.1:8080
#                                   \
#                                    (default)---> (cluster_relaxed) 10.0.0.2:8080
#
# Circuit breakers limit concurrent in-flight requests and retries per cluster
# and per routing priority (DEFAULT or HIGH). When a limit is exceeded, arion
# returns HTTP 503 with the response header x-envoy-overloaded: true.
#
# Thresholds are configured per cluster under circuit_breakers.thresholds.
# Each entry targets one RoutingPriority; omitted priorities use arion defaults:
#   max_requests: 1024
#   max_retries:  3
#
# track_remaining: when true, arion tracks remaining capacity (useful for
# observability and gauges).
#
# Note: max_connections exists in the config schema but is not yet enforced
# by the arion runtime (connection counting is not implemented).

runtime:
  num_cpus: 2
  num_runtimes: 2
  event_interval: 31
  global_queue_interval: null
  max_io_events_per_tick: null

logging:
  log_level: "info"

envoy_bootstrap:
  static_resources:
    listeners:
      - name: listener_http
        address:
          socket_address: { address: 0.0.0.0, port_value: 8000 }
        filterChains:
          - name: filter_chain_http
            filter_chain_match:
              destination_port: 8000
            filters:
              - name: http_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_http
                  codecType: HTTP1
                  httpFilters:
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  routeConfig:
                    name: basic_http_route
                    virtual_hosts:
                      - name: backend
                        domains: ["*"]
                        routes:
                          - match:
                              prefix: "/strict"
                            route:
                              cluster: cluster_strict
                          - match:
                              prefix: "/"
                            route:
                              cluster: cluster_relaxed

    clusters:
      # cluster_strict: tight limits for a sensitive upstream. Both DEFAULT and
      # HIGH priority thresholds are configured independently.
      - name: cluster_strict
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        circuit_breakers:
          thresholds:
            - priority: DEFAULT
              max_requests: 50
              max_retries: 3
              track_remaining: true
            - priority: HIGH
              max_requests: 100
              max_retries: 5
              track_remaining: true
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 10.0.0.1
                        port_value: 8080

      # cluster_relaxed: permissive limits for a less critical upstream.
      # Only the DEFAULT priority is overridden; HIGH priority uses arion defaults.
      - name: cluster_relaxed
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        circuit_breakers:
          thresholds:
            - priority: DEFAULT
              max_requests: 2000
              max_retries: 10
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 10.0.0.2
                        port_value: 8080
