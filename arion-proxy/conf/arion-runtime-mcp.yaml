#                                       /proxy/    ---> (cluster1) 192.168.2.10:80
#                                      |
#  http request ---> 192.168.1.1:8080 -|
#                                      |
#                                       (default)  ---> (cluster2) 127.0.0.1:80
#
#                                       /proxy/    ---> (cluster3) 192.168.2.10:81 (h2)
#                                      |
#  http request ---> 192.168.1.1:8081 -|
#                                      |
#                                      / 404
#

runtime:
  num_cpus: 2
  num_runtimes: 2
  event_interval: 31          # estimated optimal value
  global_queue_interval: null   # default
  max_io_events_per_tick: null  # default

logging:
  log_level: "debug"
#  log_directory: "."
#  log_file: "arion.log"

envoy_bootstrap:
  static_resources:
    listeners:
      - name: listener_http
        address:
          socket_address: { address: 0.0.0.0, port_value: 8000 }
        filterChains:
          - name: filter_chain_http
            filter_chain_match:
              destination_port: 8000
            filters:
              - name: http_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_http
                  codecType: HTTP1
                  httpFilters:
                    - name: arion.filters.http.mcp
                      typed_config:
                        "@type": type.googleapis.com/arion.extensions.filters.http.mcp.mcp_gateway.v3.McpGateway
                        server_info:
                          name: "arion-mcp-gateway"
                          version: "0.0.1"
                        upstream_timeout: 15s
                        max_upstream_response_bytes: 1048576
                        tools:
                          - name: "weather_get_forecast"
                            description: "Get weather forecast for a location"
                            input_schema:
                              inline_string: >-
                                {
                                  "type": "object",
                                  "properties": {
                                    "latitude": {
                                      "type": "number"
                                    },
                                    "longitude": {
                                      "type": "number"
                                    },
                                    "days": {
                                      "type": "integer",
                                      "default": 7
                                    }
                                  },
                                  "required": ["latitude", "longitude"]
                                }
                            output_schema:
                              inline_string: >-
                                {
                                  "type": "object",
                                  "properties": {
                                    "temperature": {
                                      "type": "number",
                                      "description": "Current temperature in Celsius"
                                    },
                                    "humidity": {
                                      "type": "number",
                                      "description": "Humidity percentage"
                                    },
                                    "condition": {
                                      "type": "string",
                                      "description": "Weather condition (e.g., sunny, cloudy, rainy)"
                                    }
                                  },
                                  "required": ["temperature", "condition"]
                                }
                            rest_backend:
                             cluster: weather_api_cluster
                             method: GET
                             path: "/v1/forecast/{{days}}"
                             query_params:
                               - name: "days"
                                 source: "days"
                               - name: "lat"
                                 source: "latitude"
                               - name: "lon"
                                 source: "longitude"
                             body_template:
                               inline_string: >-
                                   "latitude": "{{latitude}}",
                                   "longitude": "{{longitude}}",
                                   "days": "{{days}}"
                          - name: "user_profile_get"
                            description: "Get user profile information"
                            input_schema:
                              inline_string: >-
                                {
                                  "type": "object",
                                  "properties": {
                                    "user_id": {
                                      "type": "string"
                                    }
                                  },
                                  "required": ["user_id"]
                                }
                            rest_backend:
                              cluster: user_profile_api_cluster
                              method: GET
                              path: "/v1/user/profile"
                          - name: "admin_delete_user"
                            description: "Delete a user account (admin only)"
                            rbac:
                              action: ALLOW
                              permissions:
                                - jwt_claim:
                                    field: "role"
                                    value: "admin"
                            input_schema:
                              inline_string: >-
                                {
                                  "type": "object",
                                  "properties": {
                                    "user_id": {
                                      "type": "string"
                                    }
                                  },
                                  "required": ["user_id"]
                                }
                            rest_backend:
                              cluster: user_profile_api_cluster
                              method: DELETE
                              path: "/v1/admin/user"
                          # --- tools served by an upstream MCP server ---
                          # Pinned by name rather than discovered: the gateway
                          # dials `url` directly with its own MCP client (no
                          # cluster involved) and sends `name` upstream verbatim
                          # in tools/call, so it must match the upstream tool
                          # name exactly. Set `transport` explicitly, the proto
                          # default is Sse and only StreamableHttp is
                          # implemented. Schemas are optional here: omitted,
                          # tools/list advertises an empty input schema;
                          # supplied, they are advertised and the input schema
                          # is enforced, just as for rest_backend tools. Pinning
                          # also allows per-tool rbac, whereas the rbac block of
                          # a dynamic_mcp_servers entry covers every tool of
                          # that server.
                          - name: "echo"
                            description: "Echo back the supplied message"
                            mcp_server_backend:
                              transport: StreamableHttp
                              url: http://127.0.0.1:3001/mcp
                          - name: "add"
                            description: "Add two numbers"
                            mcp_server_backend:
                              transport: StreamableHttp
                              url: http://127.0.0.1:3001/mcp
                        # Upstream MCP servers whose tools are discovered at
                        # runtime. Each server materialises one registry entry
                        # per tool it exposes, namespaced as `{name}__{tool}`.
                        dynamic_mcp_servers:
                          - name: "everything"
                            description: "everything mcp server"
                            transport: StreamableHttp
                            url: http://127.0.0.1:3001/mcp
                            cache_duration: 10s
                        # Uncomment to bind this filter to an xDS Tool Discovery
                        # Service stream. Tool and DynamicMcpServer resources
                        # on that stream will augment the lists above.
                        # tds:
                        #   config_name: "my-mcp-config"
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  routeConfig:
                    name: basic_http_route
                    virtual_hosts:
                      - name: mcp_gateway
                        domains: ["*"]
                        routes:
                          - match:
                              prefix: "/"
                            route:
                              # MCP tool calls dispatch directly to their configured clusters.
                              # This route is only a fallback for requests not handled by the filter.
                              cluster: weather_api_cluster

    clusters:
      - name: weather_api_cluster
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 127.0.0.1
                        port_value: 4001

      - name: user_profile_api_cluster
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 127.0.0.1
                        port_value: 4002
