[package]
edition.workspace      = true
license-file.workspace = true
name                   = "orion-e2e-tests"
rust-version.workspace = true
version.workspace      = true
description            = "E2E test harness for Orion Proxy"

[dependencies]
tokio.workspace       = true
futures.workspace     = true
tokio-stream.workspace = true
hyper-util.workspace  = true
http.workspace        = true
http-body.workspace   = true
http-body-util.workspace = true
serde.workspace       = true
serde_json.workspace  = true
serde_yaml.workspace  = true
thiserror.workspace   = true
tracing.workspace     = true
bytes.workspace       = true
orion-data-plane-api.workspace = true
orion-xds.workspace = true
prost.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-prost.workspace = true
hyper           = { version = "1.7", features = ["server", "http1"] }
uuid = { version = "1", features = ["v4"] }
pingora-timeout = "0.3.0"
dashmap = "6"
atomic-take = "1.1.0"
tokio-rustls = "0.26"
ppp                 = { workspace = true }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pemfile = "2"
test-log = { version = "0.2.19", features = ["trace"] }
futures-util = "0.3.32"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
clap = { version = "4.5.51", features = ["derive"] }
pingora = { version = "0.8.0", features = ["time"] }
fastembed = { version = "4", optional = true, default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }

[dev-dependencies]
tracing-test.workspace = true

[features]
default = []
fastembed-service = ["dep:fastembed"]
mcp-tests = []

[[example]]
name = "fastembed_embedding_service"
path = "examples/fastembed_embedding_service.rs"
required-features = ["fastembed-service"]

[[test]]
name = "mcp_gateway_semantic_search"
path = "tests/mcp_gateway_semantic_search.rs"

[build-dependencies]
tonic-prost-build.workspace = true

[lints]
workspace = true
