rmcp                     = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
rustc-hash               = "1.1.0"
rustls                   = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile           = "2.2"
rustls-platform-verifier = "0.3"
rustls-webpki            = "0.102"
schemars                 = { version = "1.2.2", features = ["std", "derive", "chrono04"] }
scopeguard               = "1.2.0"
serde                    = { version = "1.0.229", features = ["derive", "rc"] }
serde_json               = "1.0.151"
serde_path_to_error      = "0.1.20"
serde_regex              = "1.2.0"
sse-stream               = "0.2"
serde_yaml               = "0.9.34"
smallvec                 = { version = "1", features = ["union"] }
smol_str                 = { version = "0.3.6", features = ["serde"] }
str-utils 		         = "0.3.7"
tempfile                 = "3.27"
test-log                 = { version = "0.2.21", features = ["trace"] }
thiserror                = "2.0.21"
thread-id                = "5.1.0"
thread_local             = "1.1.10"
swc_common               = "14"
swc_fast_ts_strip        = { package = "swc_ts_fast_strip", version = "=26.0.0" }
tikv-jemalloc-ctl        = { version = "0.6.1", features = ["stats"] }
tikv-jemallocator        = { version = "0.6" }
tokio                    = { version = "1.53", features = ["full"] }
tokio-rustls             = "0.26"
tokio-stream             = { version = "0.1.19", features = ["net", "sync"] }
tokio-util               = { version = "0.7.20", features = ["rt"] }
tonic                    = "0.14"
tonic-build              = "0.14"
tonic-health             = "0.14"
tonic-prost              = "0.14"
tonic-prost-build        = "0.14"
tower                    = { version = "0.5.3", features = ["make"] }
tower-service            = "0.3.3"
traceparent              = "0.0.3"
tracing                  = "0.1.44"
tracing-appender         = "0.2.5"
tracing-rolling-file     = { version = "0.1.3", features = ["non-blocking"] }
tracing-subscriber       = "0.3"
tracing-test             = { version = "0.2", features = ["no-env-filter"] }
twox-hash                = "1.6.3"
typed-builder            = "0.18.2"
time                     = { version = "0.3.55", features = ["local-offset"]}
upon                     = "0.8"
url                      = "2"
uuid                     = { version = "1.27.0", features = ["v4"] }
wasmtime 	             = "40.0.4"
wasmtime-wasi            = { version = "40.0.4", default-features = false, features = ["p2"] }
x509-parser              = { version = "0.17", features = ["default"] }

[profile.release]
codegen-units    = 16
debug            = false
debug-assertions = false
incremental      = false
opt-level        = 3
overflow-checks  = false
lto              = "thin"
panic            = "unwind"
strip            = "debuginfo"

[profile.release-max]
inherits         = "release"
codegen-units    = 1
lto              = "fat"
panic            = "abort"
strip            = true

[profile.release-debuginfo]
inherits        = "release"
debug           = "full"
codegen-units   = 16
opt-level       = 2
lto             = false
strip           = false
#split-debuginfo = "packed"

[profile.release-dhat]
debug    = 1
inherits = "release"

[profile.bench]
inherits = "release"

# avoid
[profile.dev.package."*"]
debug = 0

[workspace.lints.rust]
ambiguous_negative_literals         = "warn"
redundant_imports                   = "warn"
redundant_lifetimes                 = "warn"
trivial_numeric_casts               = "warn"
unsafe_op_in_unsafe_fn              = "warn"
unused_lifetimes                    = "warn"

[workspace.lints.clippy]
#cargo                              = { level = "warn", priority = -1 }
complexity                          = { level = "warn", priority = -1 }
correctness                         = { level = "deny", priority = 10 }
pedantic                            = { level = "warn", priority = -1 }
perf                                = { level = "warn", priority = -1 }
style                               = { level = "warn", priority = -1 }
suspicious                          = { level = "warn", priority = -1 }

# -- Overrides: Increased severity --
disallowed_methods                  = "deny"
transmute_ptr_to_ptr                = "deny"
unchecked_time_subtraction          = "deny"
