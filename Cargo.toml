[workspace]
members = [
  "envoy-data-plane-api",
  "arion-configuration",
  "arion-data-plane-api",
  "arion-http-header",
  "arion-e2e-tests",
  "arion-interner",
  "arion-format",
  "arion-lib",
  "arion-metrics",
  "arion-stats",
  "arion-proxy",
  "arion-tracing",
  "arion-wasm-types",
  "arion-xds",
  "tools/hyper_unix_listener",
]
exclude = [
  "arion-sandbox",
  "arion-wasm-sdk",
  "arion-wasm-sdk-macros",
]

resolver = "2"


[workspace.package]
description  = "Arion Proxy is a cloud native proxy. Arion Proxy is configurable via Envoy xDS protocol"
edition      = "2024"
license-file = "./LICENSE"
rust-version = "1.89"
version      = "0.1.0"

[workspace.dependencies]
# --- Arion Internal Crates ---
envoy-data-plane-api     = { path = "envoy-data-plane-api" }
arion-configuration      = { path = "arion-configuration" }
arion-data-plane-api     = { path = "arion-data-plane-api" }
arion-format             = { path = "arion-format" }
arion-http-header        = { path = "arion-http-header" }
arion-interner           = { path = "arion-interner" }
arion-lib                = { path = "arion-lib" }
arion-metrics            = { path = "arion-metrics" }
arion-stats              = { path = "arion-stats" }
arion-tracing            = { path = "arion-tracing" }
arion-wasm-types         = { path = "arion-wasm-types" }
arion-xds                = { path = "arion-xds" }

# --- Third-party Dependencies ---
abort-on-drop            = "0.2"
affinity                 = "0.1.2"
ahash                    = "0.8.12"
anyhow                   = "1"
arc-swap                 = "1.9.2"
arrayvec                 = "0.7.8"
assert_matches           = "1.5.0"
async-stream             = "0.3"
atomic-take              = "1.1.0"
atomic-time              = "0.1.5"
atomic_enum              = "0.3.0"
atomicoption             = "0.2.0"
axum                     = "0.8.9"
axum-test                = "17.3.0"
base64                   = "0.22.1"
base64-serde             = "0.7.0"
bitflags                 = { version = "2.13.2", features = ["serde"] }
blake3                   = "1.8.7"
bounded-integer          = "0.6.2"
bytes                    = "1"
caps                     = "0.5"
cedar-policy             = "4.13"
cedar-policy-core        = "4.13"
chrono                   = { version = "0.4.45", features = ["serde"] }
clap                     = { version = "4.6.7", features = ["derive"] }
const-str                = "1.1.0"
const_format             = "0.2.36"
contatori                = "0.7.5"
criterion                = "0.5.1"
crossbeam-queue          = "0.3.14"
chrono-tz                = "0.10.4"
ctor                     = "0.2"
ctor_0_6                 = { package = "ctor", version = "0.6.3" }
dhat                     = "0.3.3"
enum_dispatch            = "0.3.13"
exponential-backoff      = "2.1"
flume                    = "0.12.0"
futures                  = "0.3"
futures-util             = "0.3"
glob                     = "0.3"
h2                       = "0.4.20"
hickory-resolver         = { version = "0.24", features = ["system-config"] }
http                     = "1.5.0"
http-body                = "1.1"
http-body-util           = "0.1.5"
http-serde-ext           = "1.0.2"
humantime-serde          = "1.1.1"
hyper                    = { version = "1.12.0", features = ["full"] }
hyper-util               = { version = "0.1.21", features = ["full"] }
hyper-rustls             = { version = "0.27.10", features = ["default", "http2"] }
hyperlocal               = "0.9.1"
ipnet                    = "2.12"
itertools                = "0.14.0"
itoa                     = "1.0.18"
jsonschema               = "0.42.2"
jsonwebtoken             = { version = "10.4.0", features = ["aws_lc_rs"] }
lasso                    = { version = "0.7.3", features = ["ahash", "ahasher", "multi-threaded"] }
lru_time_cache           = "0.11.11"
maud                     = "0.26"
memory-stats             = "1.2.0"
moka                     = { version = "0.12.16", features = ["sync"] }
nohash                   = "0.2.0"
num_cpus                 = "1"
opentelemetry            = "0.29.1"
opentelemetry-otlp       = { version = "0.29.0", features = ["grpc-tonic", "http-json", "hyper-client", "serde", "serde_json", "serialize", "tokio", "tonic"] }
