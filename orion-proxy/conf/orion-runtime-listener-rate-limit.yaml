runtime:
    num_cpus: 1
    num_runtimes: 1
    event_interval: 31 # estimated optimal value
    global_queue_interval: null # default
    max_io_events_per_tick: null # default

logging:
    log_level: "info"

envoy_bootstrap:
    admin:
      address:
        socketAddress:
          address: "0.0.0.0"
          portValue: 9901
    static_resources:
        listeners:
            - name: listener_http
              address:
                  socket_address: { address: 0.0.0.0, port_value: 8000 }
              listener_filters:
                  - name: envoy.filters.listener.local_ratelimit
                    typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.listener.local_ratelimit.v3.LocalRateLimit
                        stat_prefix: listener_local_ratelimit
                        token_bucket:
                          max_tokens: 1
                          tokens_per_fill: 1
                          fill_interval: 5s
              filterChains:
                  - name: filter_chain_http
                    filter_chain_match:
                        destination_port: 8000
                    filters:
                        - name: http_gateway
                          typedConfig:
                              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                              statPrefix: ingress_http
                              codecType: HTTP1
                              http_filters:
                                  - name: envoy.filters.http.router
                                    typedConfig:
                                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                                        start_child_span: false
                              route_config:
                                  name: basic_http_route
                                  virtual_hosts:
                                      - name: backend
                                        domains: ["*"]
                                        routes:
                                            - match:
                                                  prefix: "/"
                                              route:
                                                  cluster: default

        clusters:
            - name: default
              connect_timeout: 0.25s
              type: STATIC
              lb_policy: ROUND_ROBIN
              load_assignment:
                  endpoints:
                      - lb_endpoints:
                            - endpoint:
                                  address:
                                      socket_address:
                                          address: 127.0.0.1
                                          port_value: 4001
