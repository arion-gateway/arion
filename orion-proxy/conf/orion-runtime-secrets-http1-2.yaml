    listeners:
      - name: listener_https
        address:
          socket_address: { address: 0.0.0.0, port_value: 8443 }
        listener_filters: # Required for SNI routing
          - name: listener_https_1_tls_inspector
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
              enable_ja3_fingerprinting: false
        filter_chains:
          - name: filter_chain_https1
            filter_chain_match:
              server_names: [cnpp1.example]
            filters:
              - name: https_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  httpFilters:
                  - name: envoy.filters.http.router
                    typedConfig:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      start_child_span: false
                  codec_type: AUTO
                  route_config:
                    name: basic_https_route
                    virtual_hosts:
                      - name: backend_https
                        domains: ["*"]
                        routes:
                          - match:
                              prefix: "/http1cluster/"
                            route:
                              cluster: http1_cluster
                          - match:
                              prefix: "/http2cluster/"
                            route:
                              cluster: http2_cluster

            transport_socket:
              name: envoy.transport_sockets.tls
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                common_tls_context:
                  tls_certificate_sds_secret_configs:
                    - name: cnpp1_tls_server

    clusters:
      - name: http1_cluster
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              # force http1
              http_protocol_options: {}
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 127.0.0.1
                        port_value: 4001

      - name: http2_cluster
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              # force http2
              http2_protocol_options: {}
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 127.0.0.1
                        port_value: 4002
