    listeners:
      # TLS listener — two rate-limiting modes are shown across the two filter chains:
      #   filter_chain_cnpp1  : static domain configured → RLS domain is always "cnpp1.example"
      #                         regardless of the connection SNI.
      #   filter_chain_cnpp2  : no domain configured → RLS domain is taken from the TLS SNI
      #                         at connection time, so each subdomain is a separate RLS namespace.
      # In both cases the filter calls the RLS on each new TCP connection; responses that
      # include a quota are cached process-wide for the duration of the quota window,
      # minimising RLS round-trips under load.
      - name: listener_https
        address:
          socket_address: { address: 0.0.0.0, port_value: 8443 }
        listener_filters:
          - name: listener_https_tls_inspector
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
              enable_ja3_fingerprinting: false
        filter_chains:
          - name: filter_chain_cnpp1
            filter_chain_match:
              server_names: [cnpp1.example, "*.cnpp1.example"]
            filters:
              # Static domain mode: the configured domain is always sent to the RLS.
              # All connections through this filter chain share one quota bucket keyed
              # by "cnpp1.example", regardless of the specific subdomain in the SNI.
              - name: envoy.filters.network.ratelimit
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.ratelimit.v3.RateLimit
                  stat_prefix: global_ratelimit_cnpp1
                  domain: cnpp1.example
                  failure_mode_deny: true   # drop connection when RLS is unreachable, defaults to false
                  descriptors:
                    - entries:
                        - key: destination_cluster
                          value: cnpp1
                  rate_limit_service:
                    grpc_service:
                      envoy_grpc:
                        cluster_name: rls_cluster
              - name: https_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_https
                  codecType: HTTP1
                  httpFilters:
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  route_config:
                    name: https_route
                    virtual_hosts:
                      - name: backend_https
                        domains: ["*"]
                        routes:
                          - match:
                              prefix: "/"
                            route:
                              cluster: upstream_cluster
            transport_socket:
              name: envoy.transport_sockets.tls
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                common_tls_context:
                  tls_certificate_sds_secret_configs:
                    - name: cnpp1_tls_server

          - name: filter_chain_cnpp2
            filter_chain_match:
              server_names: [cnpp2.example, "*.cnpp2.example"]
            filters:
              # SNI-driven domain mode: no domain is configured, so the TLS SNI read at
              # connection time is used as the RLS domain. Each distinct SNI value is
              # sent as a separate RLS namespace and maintains its own quota bucket.
              - name: envoy.filters.network.ratelimit
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.ratelimit.v3.RateLimit
                  stat_prefix: global_ratelimit_cnpp2
                  failure_mode_deny: false
                  descriptors:
                    - entries:
                        - key: destination_cluster
                          value: cnpp2
                  rate_limit_service:
                    grpc_service:
                      envoy_grpc:
                        cluster_name: rls_cluster
              - name: https_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_https
                  codecType: HTTP1
                  httpFilters:
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  route_config:
                    name: https_route
                    virtual_hosts:
                      - name: backend_https
                        domains: ["*"]
                        routes:
                          - match:
                              prefix: "/"
                            route:
                              cluster: upstream_cluster
            transport_socket:
              name: envoy.transport_sockets.tls
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                common_tls_context:
                  tls_certificate_sds_secret_configs:
                    - name: cnpp2_tls_server

      # Plain TCP/HTTP listener — no TLS inspector, so the domain field is required in
      # the rate limit filter. The RLS domain is always the statically configured value.
      - name: listener_http
        address:
          socket_address: { address: 0.0.0.0, port_value: 8000 }
        filter_chains:
          - name: filter_chain_http
            filters:
              - name: envoy.filters.network.ratelimit
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.ratelimit.v3.RateLimit
                  stat_prefix: global_ratelimit_http
                  domain: http.example      # required: no TLS inspector, so no SNI is available
                  failure_mode_deny: true
                  descriptors:
                    - entries:
                        - key: destination_cluster
                          value: http_backend
                  rate_limit_service:
                    grpc_service:
                      envoy_grpc:
                        cluster_name: rls_cluster
              - name: http_gateway
                typedConfig:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  statPrefix: ingress_http
                  codecType: HTTP1
                  httpFilters:
                    - name: envoy.filters.http.router
                      typedConfig:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                        start_child_span: false
                  route_config:
                    name: http_route
                    virtual_hosts:
                      - name: backend_http
                        domains: ["*"]
                        routes:
                          - match:
                              prefix: "/"
                            route:
                              cluster: upstream_cluster

    clusters:
      - name: upstream_cluster
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 127.0.0.1
                        port_value: 4001

      # Rate Limit Service (RLS) must speak gRPC (HTTP/2).
      # Point this at a compatible RLS implementation such as
      # github.com/envoyproxy/ratelimit or a custom service.
      - name: rls_cluster
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          endpoints:
            - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 127.0.0.1
                        port_value: 8081
