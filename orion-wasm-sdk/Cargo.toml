[package]
name = "orion_wasm_sdk"
version = "0.1.0"
edition = "2021"
description = "Guest-side SDK for writing WebAssembly plugins that run inside the Orion proxy."
license = "Apache-2.0"

# This crate is intentionally kept out of the main Orion workspace so it can
# be consumed standalone by external plugin authors compiling to wasm32.
[workspace]

[dependencies]
orion-wasm-types = { path = "../orion-wasm-types" }
orion-wasm-sdk-macros = { path = "../orion-wasm-sdk-macros" }
tracing = "0.1"
http = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smol_str  = { version = "0.3.5", features = ["serde"] }
http-serde-ext = { version = "1.0.2" }
